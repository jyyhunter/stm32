; ============================================================================
;  PlatformIO 工程配置 —— STM32F103VET6 + STM32F10x 标准外设库(SPL) 裸机
;  构建工具：arm-none-eabi-gcc（PlatformIO 自动下载，无需手动安装）
;  说明：本工程与 Keil 工程(STM32固件/Project.uvprojx)源码一致、互不影响。
; ============================================================================

[platformio]
default_envs = genericSTM32F103VE

[env:genericSTM32F103VE]
; ---- 平台 / 芯片 ----
platform       = ststm32
board          = genericSTM32F103VE

; 不使用 HAL / Arduino 等任何框架：直接编译 STM32F10x 标准外设库
framework      = 

; ---- 下载 / 调试（默认 ST-Link，另可改为串口下载，见 README）----
upload_protocol = stlink
debug_tool      = stlink

; ---- 自定义链接脚本（512K Flash / 64K RAM）----
board_build.ldscript = $PROJECT_DIR/linker/STM32F103VETx_FLASH.ld

; ---- 链接后额外生成 .hex（方便串口烧录工具使用）----
extra_scripts = tools/build_hex.py

build_flags =
    -nostartfiles
    -D STM32F10X_HD
    -D USE_STDPERIPH_DRIVER
    -Isrc
    -Isrc/Start
    -Isrc/Library
    -Isrc/System
    -Isrc/Hardware
    -Isrc/Hardware/MS901
    -Isrc/User
    -Wno-unused-parameter
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-comment
    -Wno-implicit-function-declaration

; 编译 src 下的全部源码（含所有 SPL 驱动，与 Keil 工程保持一致）
build_src_filter = +<*>

monitor_speed = 115200
monitor_echo  = yes

; ============================================================================
;  串口（USB-TTL）下载方式（使用 BOOT0 + 芯片内置 UART Bootloader）：
;  把上面三行替换为下面内容后执行 pio run -t upload（需安装 stm32flash）
;
;  upload_protocol = serial
;  upload_flags    = -g
;  upload_command  = $UPLOADER -b 115200 -w "$SOURCE" -v -g
; ============================================================================
