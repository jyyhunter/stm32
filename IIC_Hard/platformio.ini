; =====================================================================
;  STM32F103VET6 标准外设库 (StdPeriph_Lib V3.5.0) —— 可复用工程模板
;  PlatformIO 标准结构：用户代码在 src/，标准库在 lib/StdPeriph_Driver/
;  工具链与 OpenOCD 由 PlatformIO 自动下载管理，无需手动安装
; =====================================================================
[env:genericSTM32F103VE]
platform = ststm32
board    = genericSTM32F103VE
; 不使用 framework，走 _bare 裸机底座

; ---- 编译选项 ----
build_flags =
    -g3                         ; 调试符号
    -DSTM32F10X_HD              ; 高密度器件(High Density, 512KB Flash)
    -DUSE_STDPERIPH_DRIVER      ; 启用标准外设库
    -Ilib/StdPeriph_Driver/src  ; 标准库与设备头文件路径
    -Isrc
    -IHardware

; ---- 链接脚本 ----
board_build.ldscript = linker/STM32F103VE_FLASH.ld

; ---- 烧录 / 调试：ST-Link(SWD) ----
upload_protocol = stlink
debug_tool      = stlink

; ---- 串口监视器（USART1 PA9/PA10，默认 115200） ----
monitor_speed = 115200
